name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            generator: "Ninja"
            cmake_flags: "-G Ninja -DCMAKE_BUILD_TYPE=Release"
            example_generator: "-G Ninja"
            example_flags: "-DCMAKE_BUILD_TYPE=Release"
            run_cmd: "./build_example/minimal_consumer"

          - name: Windows
            os: windows-latest
            generator: "Visual Studio 17 2022"
            cmake_flags: "-G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
            example_generator: "-G 'Visual Studio 17 2022' -A x64"
            example_flags: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
            run_cmd: ".\build_example\Release\minimal_consumer.exe"

          - name: Linux
            os: ubuntu-latest
            generator: "Ninja"
            cmake_flags: "-G Ninja -DCMAKE_BUILD_TYPE=Release"
            example_generator: "-G Ninja"
            example_flags: "-DCMAKE_BUILD_TYPE=Release"
            run_cmd: "./build_example/minimal_consumer"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # macOS System Dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja libyaml spdlog console_bridge tinyxml2 urdfdom eigen asio

      # Linux System Dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-dev libspdlog-dev libtinyxml2-dev libeigen3-dev libconsole-bridge-dev liburdfdom-dev libasio-dev

      # Windows System Dependencies & Configuration
      - name: Configure Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          vcpkg install libyaml tinyxml2 spdlog eigen3 asio console-bridge urdfdom --triplet x64-windows

      # Build minimal_ros2 Superbuild
      - name: Configure Superbuild
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            ${{ matrix.cmake_flags }}

      - name: Build Underlay
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      # Downstream Verification: Build and run examples/minimal_consumer
      - name: Configure Downstream Example
        shell: pwsh
        run: |
          cmake -B build_example -S examples/minimal_consumer `
            ${{ matrix.example_generator }} `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" `
            ${{ matrix.example_flags }}

      - name: Build Downstream Example
        shell: pwsh
        run: |
          cmake --build build_example --config Release

      - name: Run Downstream Example
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            $env:PATH = "${{ github.workspace }}/install/bin;$env:PATH"
          }
          ${{ matrix.run_cmd }}

      # Upload Prebuilt Underlay Archive
      - name: Package and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal_ros2-${{ matrix.name }}
          path: install/
          retention-days: 7

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # macOS System Dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja libyaml spdlog console_bridge eigen asio pybind11

      # Windows System Dependencies & Configuration
      - name: Configure Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          vcpkg install libyaml spdlog eigen3 asio console-bridge pybind11 --triplet x64-windows

      # Configure Superbuild
      - name: Configure Superbuild (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Configure Superbuild (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # Build Underlay
      - name: Build Underlay
        run: |
          cmake --build build --config Release --parallel 4

      # Downstream Verification: Build and run examples/minimal_consumer
      - name: Configure Downstream Example (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -B build_example -S examples/minimal_consumer \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Configure Downstream Example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build_example -S examples/minimal_consumer `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # Build Downstream Example
      - name: Build Downstream Example
        run: |
          cmake --build build_example --config Release

      - name: Run Downstream Example (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./build_example/minimal_consumer

      - name: Run Downstream Example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\install\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          .\build_example\Release\minimal_consumer.exe

      # Upload Prebuilt Underlay Archive
      - name: Package and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal_ros2-${{ matrix.name }}
          path: install/
          retention-days: 7
